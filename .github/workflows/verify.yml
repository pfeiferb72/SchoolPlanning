name: Verify SchoolPlanning
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schoolplanning
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: schoolplanning
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DB_URL: jdbc:postgresql://localhost:5432/schoolplanning
      DB_USER: schoolplanning
      DB_PASSWORD: ci-test-only
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - run: mvn -B -ntp verify
      - run: npm ci --prefix qa
      - run: cd qa && npx playwright install --with-deps chromium
      - name: Browser and PostgreSQL integration
        run: |
          java -jar target/schoolplanning-1.0.0.jar > application.log 2>&1 &
          trap 'kill $! || true' EXIT
          curl -fsS --retry 40 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/health
          node qa/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/site/jacoco
            target/surefire-reports
            application.log
