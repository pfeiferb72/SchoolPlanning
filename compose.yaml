name: schoolplanning
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: schoolplanning
      POSTGRES_USER: schoolplanning
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-schoolplanning}
    volumes:
      - schooldata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolplanning -d schoolplanning"]
      interval: 4s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      DEMO_MODE: "true"
      DB_URL: jdbc:postgresql://db:5432/schoolplanning
      DB_USER: schoolplanning
      DB_PASSWORD: ${DB_PASSWORD:-local-schoolplanning}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  schooldata:
