name: Verify SchoolPlanning
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: qa/package-lock.json
      - run: mvn -B -ntp verify
      - run: npm ci --prefix qa
      - name: Build and test the complete Compose deployment
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: |
          trap 'docker compose logs --no-color > application.log; docker compose down' EXIT
          docker compose up -d --build
          curl -fsS --retry 60 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/health
          node qa/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/site/jacoco
            target/surefire-reports
            application.log
