spring:
  session:
    jdbc:
      initialize-schema: never
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/schoolplanning}
    username: ${DB_USER:schoolplanning}
    password: ${DB_PASSWORD:}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
spps:
  demo: ${DEMO_MODE:false}
  bootstrap-sub: ${ADMIN_SUB:}
  sender: ${SMTP_FROM:schoolplanning@localhost}
springdoc:
  swagger-ui:
    path: /api-docs
